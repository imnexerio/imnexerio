name: Update GitHub Profile

on:
  schedule:
    - cron: '0 0 * * 1'  # Runs at midnight every Monday
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-readme:
    name: Update Profile README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # Setup Python for running our scripts
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      # Update current work section
      - name: Update Current Work Section
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python .github/scripts/update_current_work.py

      # Generate GitHub stats
      - name: Update GitHub Stats
        uses: anuraghazra/github-readme-stats@master
        with:
          username: ${{ github.repository_owner }}
          show_icons: true
          count_private: true
          theme: dark
          include_all_commits: true
          hide_border: false
          token: ${{ secrets.GH_TOKEN }}

      # Generate Snake Animation
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Deploy Snake Animation to the output branch
      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # Commit and push changes
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git add dist/
          git commit -m "Update GitHub profile" -a || echo "No changes to commit"
          git push "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
