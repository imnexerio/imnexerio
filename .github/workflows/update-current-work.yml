name: Update Current Work Section
on:
  schedule:
    - cron: '0 0 * * 1'  # Runs at 00:00 UTC every Monday
  workflow_dispatch:  # Allows manual triggering
jobs:
  update-current-work:
    name: Update Current Work Section
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicitly grant write permissions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}  # Add token here for checkout
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub
      - name: Update Current Work Section
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python .github/scripts/update_current_work.py
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Update current work section" -a || echo "No changes to commit"
          git push "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
